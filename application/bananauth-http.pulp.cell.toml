name = "bananauth"
version = "0.2.0"
wasm = "../pulp-cell/bananauth.wasm"
wasm_sha256 = "64cf7e4f5359a6981370073edf8c784fad0a2ee00e6a4f5b4fe486869eaeef10"

consumes = ["orchestrator.dispatch"]
depends_on = ["bananauth-lua"]

# The compatibility shell owns HTTP projection and privileged effects while
# stateful session lifecycle is sequenced through Lua into auth-session.
capabilities = [
  "transport.http.inbound",
  "transport.http.outbound",
  "identity.oauth.provider",
  "identity.jwt.hs256",
  "storage.sqlite",
  "entropy.read",
]

[config]
token_expiry_minutes = 1440
composed_sessions = true
composed_identity = true
auth_methods = ["password", "discord"]
# In composed mode, Discord client ID and secret are host-owned through
# identity.oauth.provider. This public redirect binding must match the host
# provider configuration; it is not a credential.
discord_redirect_url = ""
