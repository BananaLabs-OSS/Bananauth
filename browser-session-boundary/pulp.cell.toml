name = "auth-browser-session"
version = "0.1.0"
wasm = "auth-browser-session.wasm"
wasm_sha256 = "a22bab5b9f4a02bcf62a5a7fa4a5ea3f488400dc1c48e5728fac5981752747f7"

provides = ["auth.browser-session.v1.resolve"]
consumes = ["auth.session.v1.get"]
depends_on = ["auth-session"]

# This stateless credential boundary verifies host-owned JWTs and asks the
# durable session owner for the current lifecycle fact. It owns no storage,
# browser credential, session lifecycle, transport, delivery, or network.
capabilities = ["identity.jwt.hs256"]
