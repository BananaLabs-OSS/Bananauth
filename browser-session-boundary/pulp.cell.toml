name = "auth-browser-session"
version = "0.1.0"
wasm = "auth-browser-session.wasm"
wasm_sha256 = "0af45e3086f9d4c636c7db961615426a195c6f8c9236cb8fc6f63d5a629666c3"

provides = ["auth.browser-session.v1.resolve", "auth.browser-session.v1.complete-email-verification"]
consumes = ["auth.session.v1.get", "auth.session.v1.create-owned", "auth.identity.v1.email-verification.consume"]
depends_on = ["auth-session", "auth-identity"]

# This stateless credential boundary verifies host-owned JWTs and asks the
# durable session owner for the current lifecycle fact. It owns no storage,
# browser credential, session lifecycle, transport, delivery, or network.
capabilities = ["identity.jwt.hs256"]
